name: CI and GitHub Pages
on:
  push:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    name: Validate tests and generated content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run project validation
        uses: ./.github/actions/validate
  deploy:
    name: Deploy production GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
