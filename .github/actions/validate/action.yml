name: Validate project

description: Run the existing test suite and generated-content consistency checks.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Node dependencies
      shell: bash
      run: npm ci

    - name: Install Chromium for browser smoke tests
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Run unit and browser smoke tests
      shell: bash
      run: npm test

    - name: Validate generated advanced content
      shell: bash
      run: python3 scripts/build-advanced-content.py --check

    - name: Validate generated level content
      shell: bash
      run: python3 scripts/build-level-content.py --check
